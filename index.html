      if (defenseMode) {
        ctx.fillText(`Волна: ${defenseWave - 1}`, W / 2, H / 2 + 25);
      }
      ctx.fillText(`Монеты за забег: ${runStats.coins} | Всего монет: ${wallet.coins}`, W / 2, H / 2 + 50);
      ctx.fillText(`Рекорд: ${stats.bestScore}`, W / 2, H / 2 + 80);
      ctx.fillStyle = '#f1c40f'; ctx.fillText('Нажми R, чтобы начать заново', W / 2, H / 2 + 115);
      ctx.textAlign = 'left';
    }

    function drawButton(text, x, y, w, h) {
      const hover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
      ctx.fillStyle = hover ? 'rgba(44, 62, 80, 0.9)' : 'rgba(26, 37, 47, 0.8)';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = hover ? '#3498db' : '#27406d'; ctx.lineWidth = 2;
      if (hover) { ctx.shadowColor = '#3498db'; ctx.shadowBlur = 10; }
      ctx.strokeRect(x, y, w, h); ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = '20px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, x + w / 2, y + h / 2);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      return hover && clicked;
    }

    function drawSlider(text, val, x, y, w, onChange) {
      ctx.fillStyle = '#eaf2ff'; ctx.font = '14px monospace'; ctx.fillText(`${text}: ${Math.round(val * 100)}%`, x, y - 5);
      const hover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + 10;
      ctx.fillStyle = '#1a252f'; ctx.fillRect(x, y, w, 10);
      ctx.fillStyle = '#3498db'; ctx.fillRect(x, y, w * val, 10);
      if (clicked && hover) onChange(clamp((mouseX - x) / w, 0, 1));
    }

    function drawMenu() {
      ctx.fillStyle = '#ffffff'; ctx.font = '40px monospace'; ctx.textAlign = 'center'; ctx.shadowColor = '#70a1ff'; ctx.shadowBlur = 15;
      ctx.fillText('КОСМИЧЕСКИЙ КОРАБЛИК', W / 2, 100); ctx.shadowBlur = 0;
      ctx.font = '18px monospace'; ctx.fillStyle = '#f1c40f'; ctx.fillText(`Монеты: ${wallet.coins}`, W / 2, 140);
      ctx.textAlign = 'left';
      if (drawButton('ИГРАТЬ', W / 2 - 100, 180, 200, 45)) { reset(); gameState = 'playing'; playSound('click'); }
      if (drawButton('ОБОРОНА', W / 2 - 100, 235, 200, 45)) { startDefenseMode(); playSound('click'); }
      if (drawButton('МАГАЗИН', W / 2 - 100, 290, 200, 45)) { gameState = 'shop'; playSound('click'); }
      if (drawButton('НАСТРОЙКИ', W / 2 - 100, 345, 200, 45)) { gameState = 'settings'; playSound('click'); }
      if (drawButton('РЕКОРДЫ', W / 2 - 100, 400, 200, 45)) { gameState = 'records'; playSound('click'); }
      ctx.fillStyle = '#bdc3c7'; ctx.font = '14px monospace'; ctx.textAlign = 'center';
      ctx.fillText('Управление находится в настройках → подсказки', W / 2, H - 15); ctx.textAlign = 'left';
    }

    function drawSettings() {
      ctx.fillStyle = '#ffffff'; ctx.font = '30px monospace'; ctx.textAlign = 'center'; ctx.fillText('НАСТРОЙКИ', W / 2, 40); ctx.textAlign = 'left';
      const names = ['Легко', 'Норм', 'Сложно', 'Кастом'];
      for (let i = 0; i < 4; i++) {
        const bx = 60 + i * 170, selected = settings.difficulty === i;
        ctx.fillStyle = selected ? '#2980b9' : '#1a252f'; ctx.fillRect(bx, 65, 150, 30);
        ctx.strokeStyle = '#3498db'; ctx.strokeRect(bx, 65, 150, 30);
        ctx.fillStyle = '#ffffff'; ctx.font = '14px monospace'; ctx.textAlign = 'center'; ctx.fillText(names[i], bx + 75, 85); ctx.textAlign = 'left';
        if (clicked && mouseX >= bx && mouseX <= bx + 150 && mouseY >= 65 && mouseY <= 95) { settings.difficulty = i; saveAll(); playSound('click'); }
      }
      if (settings.difficulty === 3) {
        const c = settings.custom;
        drawSlider('Скорость очков', c.score, 50, 130, 380, (v) => { c.score = v; saveAll(); });
        drawSlider('Количество метеоритов', c.spawn, 50, 165, 380, (v) => { c.spawn = v; saveAll(); });
        drawSlider('Скорость метеоритов', c.speed, 50, 200, 380, (v) => { c.speed = v; saveAll(); });
        drawSlider('HP босса', c.bossHp, 50, 235, 380, (v) => { c.bossHp = v; saveAll(); });
        drawSlider('Скорость атак босса', c.bossCd, 50, 270, 380, (v) => { c.bossCd = v; saveAll(); });
        drawSlider('Частота орбов', c.orb, 50, 305, 380, (v) => { c.orb = v; saveAll(); });
        drawSlider('Макс. метеоритов', c.maxAst, 50, 340, 380, (v) => { c.maxAst = v; saveAll(); });
      }
      drawSlider('Общая громкость', settings.masterVol, 520, 130, 380, (v) => { settings.masterVol = v; updateMasterVolume(); saveAll(); });
      drawSlider('Музыка', settings.musicVol, 520, 165, 380, (v) => { settings.musicVol = v; updateMasterVolume(); saveAll(); });
      drawSlider('Выстрелы', settings.sfxShoot, 520, 200, 380, (v) => { settings.sfxShoot = v; saveAll(); });
      drawSlider('Взрывы', settings.sfxExplosion, 520, 235, 380, (v) => { settings.sfxExplosion = v; saveAll(); });
      drawSlider('Босс', settings.sfxBoss, 520, 270, 380, (v) => { settings.sfxBoss = v; saveAll(); });
      drawSlider('Интерфейс', settings.sfxUI, 520, 305, 380, (v) => { settings.sfxUI = v; saveAll(); });
      if (drawButton('ТЕСТ ЗВУКА', 520, 355, 170, 35)) { playSound('explosion'); playSound('bossSpawn'); }
      if (drawButton('ПОДСКАЗКИ', 520, 405, 170, 35)) { gameState = 'help'; playSound('click'); }
      if (drawButton('НАЗАД', W / 2 - 100, 470, 200, 50)) { gameState = 'menu'; playSound('click'); }
    }

    function drawHelp() {
      ctx.fillStyle = '#ffffff'; ctx.font = '30px monospace'; ctx.textAlign = 'center'; ctx.fillText('ПОДСКАЗКИ / УПРАВЛЕНИЕ', W / 2, 60);
      ctx.textAlign = 'left'; ctx.font = '16px monospace';
      const lines = [
        'WASD / стрелки — движение',
        'Пробел — стрельба',
        'E / Shift — замедление времени',
        'Q — рывок',
        'B — бомба',
        'M — звук вкл/выкл',
        'N — музыка вкл/выкл',
        'Esc — меню / отмена',
        'R — рестарт после смерти',
        '',
        'Режим Обороны:',
        'Стреляй по шахте (слева) чтобы добывать ресурсы',
        'Кликай по слотам (с +) чтобы строить турели',
        'Вертикальная лазерная стена защищает от врагов',
        'Стреляющие враги (фиолетовые) — особая редкая разновидность'
      ];
      lines.forEach((line, i) => { ctx.fillText(line, W / 2 - 320, 110 + i * 25); });
      if (drawButton('НАЗАД', W / 2 - 100, 470, 200, 50)) { gameState = 'settings'; playSound('click'); }
    }

    function drawRecords() {
      ctx.fillStyle = '#ffffff'; ctx.font = '30px monospace'; ctx.textAlign = 'center'; ctx.fillText('РЕКОРДЫ И СТАТИСТИКА', W / 2, 60);
      ctx.textAlign = 'left'; ctx.font = '20px monospace';
      const lines = [
        `Лучший счёт: ${stats.bestScore}`,
        `Максимальное комбо: x${stats.maxCombo}`,
        `Убито боссов: ${stats.bossesKilled}`,
        `Уничтожено метеоритов: ${stats.asteroidsDestroyed}`,
        `Всего времени в игре: ${formatTime(stats.totalTime)}`,
        `Всего заработано монет: ${stats.totalCoins}`,
        `Текущие монеты: ${wallet.coins}`,
        `Всего забегов: ${stats.runs}`,
        `Макс. волна в Обороне: ${stats.defenseWaves}`
      ];
      lines.forEach((line, i) => { ctx.fillText(line, W / 2 - 280, 120 + i * 36); });
      if (drawButton('НАЗАД', W / 2 - 100, 470, 200, 50)) { gameState = 'menu'; playSound('click'); }
    }

    function drawShop() {
      ctx.fillStyle = '#ffffff'; ctx.font = '30px monospace'; ctx.textAlign = 'center'; ctx.fillText('МАГАЗИН', W / 2, 45);
      ctx.font = '20px monospace'; ctx.fillStyle = '#f1c40f'; ctx.fillText(`Монеты: ${wallet.coins}`, W / 2, 75); ctx.textAlign = 'left';
      for (let i = 0; i < SHOP_CATEGORIES.length; i++) {
        const cat = SHOP_CATEGORIES[i]; const bx = 20 + i * 155, by = 95, bw = 145, bh = 30;
        const selected = shopCategory === cat.id; const hover = mouseX >= bx && mouseX <= bx + bw && mouseY >= by && mouseY <= by + bh;
        ctx.fillStyle = selected ? '#2980b9' : hover ? '#2c3e50' : '#1a252f'; ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = selected ? '#f1c40f' : '#3498db'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
        ctx.fillStyle = '#ffffff'; ctx.font = '14px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(cat.name, bx + bw / 2, by + bh / 2);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        if (clicked && hover) { shopCategory = cat.id; playSound('click'); }
      }
      const items = SHOP_ITEMS[shopCategory];
      for (let i = 0; i < items.length; i++) {
        const item = items[i]; const col = i % 3, row = Math.floor(i / 3);
        const x = 45 + col * 300, y = 150 + row * 170, w = 270, h = 140;
        const owned = isOwned(shopCategory, item.id); const selected = cosmetics.selected[shopCategory] === item.id;
        const hover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
        ctx.fillStyle = hover ? '#22303f' : '#17222e'; ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = selected ? '#f1c40f' : owned ? '#2ecc71' : '#3498db'; ctx.lineWidth = selected ? 4 : 2; ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = '#ffffff'; ctx.font = '18px monospace'; ctx.textAlign = 'center'; ctx.fillText(item.name, x + w / 2, y + 35);
        if (item.color) { ctx.fillStyle = item.color; ctx.beginPath(); ctx.arc(x + w / 2, y + 70, 16, 0, Math.PI * 2); ctx.fill(); }
        if (item.icon) { ctx.font = '28px sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText(item.icon, x + w / 2, y + 70); ctx.textBaseline = 'alphabetic'; }
        if (!item.color && !item.icon) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + w / 2 + 20, y + 70); ctx.lineTo(x + w / 2 - 15, y + 58); ctx.lineTo(x + w / 2 - 8, y + 70); ctx.lineTo(x + w / 2 - 15, y + 82); ctx.closePath(); ctx.stroke(); }
        ctx.font = '16px monospace';
        if (selected) { ctx.fillStyle = '#f1c40f'; ctx.fillText('ВЫБРАНО', x + w / 2, y + 115); }
        else if (owned) { ctx.fillStyle = '#2ecc71'; ctx.fillText('Куплено — выбрать', x + w / 2, y + 115); }
        else { ctx.fillStyle = wallet.coins >= item.cost ? '#f1c40f' : '#ff5555'; ctx.fillText(`${item.cost} монет`, x + w / 2, y + 115); }
        ctx.textAlign = 'left';
        if (clicked && hover) buyOrSelect(shopCategory, item);
      }
      if (drawButton('НАЗАД', W / 2 - 100, 480, 200, 45)) { gameState = 'menu'; playSound('click'); }
    }

    function drawUpgradeScreen() {
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff'; ctx.font = '34px monospace'; ctx.textAlign = 'center'; ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 15;
      ctx.fillText('ВЫБЕРИ УЛУЧШЕНИЕ', W / 2, 100); ctx.shadowBlur = 0; ctx.textAlign = 'left';
      for (let i = 0; i < upgradeChoices.length; i++) {
        const up = upgradeChoices[i]; const x = 60 + i * 300, y = 160, w = 260, h = 220;
        const hover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
        ctx.fillStyle = hover ? 'rgba(44, 62, 80, 0.9)' : 'rgba(23, 34, 46, 0.9)'; ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = hover ? '#f1c40f' : '#3498db'; ctx.lineWidth = 3;
        if (hover) { ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 10; }
        ctx.strokeRect(x, y, w, h); ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff'; ctx.font = '20px monospace'; ctx.textAlign = 'center'; ctx.fillText(up.title, x + w / 2, y + 55);
        ctx.font = '14px monospace'; ctx.fillStyle = '#bdc3c7';
        const words = up.desc.split(' '); let line = '', yy = y + 100;
        for (const word of words) {
          const test = line + word + ' ';
          if (ctx.measureText(test).width > w - 30) { ctx.fillText(line, x + w / 2, yy); line = word + ' '; yy += 22; }
          else line = test;
        }
        ctx.fillText(line, x + w / 2, yy); ctx.textAlign = 'left';
        if (clicked && hover) applyUpgrade(i);
      }
    }

    let last = performance.now();
    function loop(t) {
      const dt = Math.min(0.033, (t - last) / 1000); last = t;
      if (gameState === 'playing') update(dt);
      else if (gameState === 'gameover' || gameState === 'upgrade') { if (screenShake > 0) screenShake -= dt; updateParticles(dt); }
      draw(); clicked = false; requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
